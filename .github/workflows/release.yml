name: release

# Publishes a download whenever you push a version tag such as v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'          # the oldest version we promise to support
          extensions: pdo_sqlite, pdo_mysql, zip

      - name: Check the tag looks like a version
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "The tag must look like v0.1.0 (got $GITHUB_REF_NAME)"; exit 1; }

      - name: Run the tests before publishing anything
        run: |
          php core/tests/smoke.php
          php standalone/tests/pdo_smoke.php
          php standalone/tests/installer_smoke.php
          php standalone/tests/team_smoke.php
          php standalone/tests/release_smoke.php

      - name: Build the upload folder and zip
        run: php bin/build-release.php --version="${GITHUB_REF_NAME#v}" --zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # while we are on 0.x, mark it as a pre-release so nobody mistakes it for a finished product
          FLAGS=""
          case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/livechat-$VERSION.zip" \
            --title "LiveChat $VERSION" --generate-notes $FLAGS
