name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']   # core promises 8.1+, so test the floor
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint
        run: find core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke test
        run: php core/tests/smoke.php
